# tech_dict.yaml
# Dictionary used to tag Hacker News stories/comments with technologies.
#
# Entry schema (key = canonical name, kebab-case):
#   category:           one of the values in `categories` below
#   aliases:            always match (case-insensitive, whole token; symbols like "c++" or ".net"
#                       need a symbol-safe boundary such as (?<![\w]) ... (?![\w]) instead of \b)
#   ambiguous_aliases:  common words that are ALSO technology names ("go", "swift", "bloc").
#                       Match only when at least one `context` term appears in the same text.
#   context:            words/phrases that confirm the ambiguous alias is the technology
#
# Matching order: tag the TITLE first, then the body. A story tagged from the title is
# stronger evidence than one tagged only from a comment.
# Notes:
#   * Very generic words ("software", "code", "app", "robots") are left out on purpose: they would
#     match almost every text and drown the trend signal. Topic-style entries (privacy, startups,
#     battery, ...) are broader, so for trend counting prefer TITLE matches over comment matches.
#   * An ambiguous alias must not appear in its own entry's `context` list (it would always confirm
#     itself), and one ambiguous alias can belong to only one entry.
#   * Alias strings must be unique across all entries (checked in test_tagger.py).
#   * Underscored names ("flutter_riverpod") are single tokens, so list them explicitly.
#   * Strip URLs before tagging comment text (Tagger does this by default).
#   * Optional top-level keys read by tagger.py: `implies`, `versioned`, `case_sensitive`
#     (see the tagger.py docstring). The file is validated on load.
#   * Ambiguous aliases are confirmed by a context term within 200 characters, or by the
#     story title / URL words. One entry per technology: do not bundle rivals under one key.
# This list is a starting point: review it against real data and keep adding entries.

